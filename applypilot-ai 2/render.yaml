databases:
  - name: applypilot-postgres
    plan: basic-256mb
    databaseName: applypilot
    user: applypilot

services:
  - type: web
    name: applypilot-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: applypilot-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "8"
